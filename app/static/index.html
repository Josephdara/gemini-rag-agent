<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Agent</title>
<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3dd;
    --accent: #1f5f8b; --accent-text: #ffffff; --chip: #e6eff6; --user: #1f5f8b; --user-text: #ffffff;
    --flash: #fff4cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecebe6; --muted: #9a9993; --line: #31312d;
      --accent: #7ab3dc; --accent-text: #0c1a24; --chip: #22313c; --user: #2b4a61; --user-text: #ecebe6;
      --flash: #3a3420;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 16px 120px; }
  header h1 { font-size: 17px; margin: 0; }
  header p { color: var(--muted); margin: 2px 0 24px; font-size: 13px; }

  .msg { margin: 0 0 18px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .bubble { background: var(--user); color: var(--user-text); border-radius: 14px 14px 4px 14px;
            padding: 8px 14px; max-width: 85%; white-space: pre-wrap; }
  .answer { background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 14px 16px; }
  .answer p { margin: 0 0 10px; }
  .answer p:last-child, .answer ul:last-child, .answer ol:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 10px; padding-left: 20px; }
  .answer li { margin: 3px 0; }
  .answer .heading { font-weight: 600; margin-top: 4px; }
  .answer code { font: 13px ui-monospace, monospace; background: var(--chip); border-radius: 4px; padding: 0 4px; }

  .cite { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
          padding: 0 5px; margin: 0 1px; border: 0; border-radius: 9px; background: var(--chip); color: var(--accent);
          font: 600 11px/1 system-ui, sans-serif; vertical-align: 2px; cursor: pointer; }
  .cite:hover { background: var(--accent); color: var(--accent-text); }

  .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
  .sources-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .source { display: flex; gap: 8px; align-items: baseline; border-radius: 8px; padding: 3px 8px; margin: 0 -8px;
            scroll-margin-bottom: 96px; }
  .source .num { color: var(--accent); font-weight: 600; min-width: 18px; }
  .source.flash { background: var(--flash); }

  .thinking { color: var(--muted); }
  .thinking::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .error { color: #c0392b; }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 16px;
                     padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .examples button:hover { border-color: var(--accent); }

  form { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); }
  .bar { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 11px 14px; border: 1px solid var(--line); border-radius: 22px;
          background: var(--panel); color: var(--text); font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  button[type=submit] { padding: 0 18px; border: 0; border-radius: 22px; background: var(--accent);
                        color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <header>
    <h1>RAG Agent</h1>
    <p>Answers come only from the indexed documents, with numbered sources.</p>
  </header>
  <div id="log">
    <div class="examples" id="examples">
      <button type="button">Do you ship to Canada?</button>
      <button type="button">Is my e-bike battery covered by the warranty?</button>
      <button type="button">How do I return a bike I've ridden?</button>
    </div>
  </div>
</main>
<form id="ask">
  <div class="bar">
    <input id="q" autocomplete="off" placeholder="Ask about the documents" required>
    <button type="submit">Ask</button>
  </div>
</form>
<script>
// One session per page load; the server creates it on first use.
const sessionId = crypto.randomUUID();
const log = document.getElementById("log");
const form = document.getElementById("ask");
const input = document.getElementById("q");

// Inline Markdown the agent may use, plus citations: [a.md#0] or [a.md#0, b.md#1].
const INLINE = /\*\*(.+?)\*\*|`([^`]+)`|\[([^\[\]\s,]+#\d+(?:\s*,\s*[^\[\]\s,]+#\d+)*)\]/g;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// Everything below builds DOM nodes from text; model and document text is never parsed as HTML.
function renderInline(text, parent, cite) {
  let last = 0;
  let lastChip = null;
  for (const m of text.matchAll(INLINE)) {
    const between = text.slice(last, m.index);
    parent.append(document.createTextNode(between));
    if (between.trim()) lastChip = null;
    if (m[3] !== undefined) {
      // Back-to-back citations of one document show as a single chip.
      for (const citation of m[3].split(",")) {
        const chip = cite(citation.trim());
        if (lastChip && lastChip.textContent === chip.textContent) continue;
        parent.append(chip);
        lastChip = chip;
      }
    } else if (m[1] !== undefined) {
      lastChip = null;
      const strong = el("strong");
      renderInline(m[1], strong, cite);
      parent.append(strong);
    } else {
      lastChip = null;
      parent.append(el("code", "", m[2]));
    }
    last = m.index + m[0].length;
  }
  parent.append(document.createTextNode(text.slice(last)));
}

function renderMarkdown(text, cite) {
  const root = document.createDocumentFragment();
  let paragraph = [];
  let list = null;
  const flush = () => {
    if (paragraph.length) {
      const p = el("p");
      renderInline(paragraph.join(" "), p, cite);
      root.append(p);
      paragraph = [];
    }
    list = null;
  };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const bullet = line.match(/^(?:[-*•]|(\d+)\.)\s+(.*)$/);
    const heading = line.match(/^#{1,6}\s+(.*)$/);
    if (!line) {
      flush();
    } else if (bullet) {
      if (paragraph.length) { const keep = list; flush(); list = keep; }
      const ordered = bullet[1] !== undefined;
      if (!list || (list.tagName === "OL") !== ordered) {
        list = el(ordered ? "ol" : "ul");
        root.append(list);
      }
      const li = el("li");
      renderInline(bullet[2], li, cite);
      list.append(li);
    } else if (heading) {
      flush();
      const p = el("p", "heading");
      renderInline(heading[1], p, cite);
      root.append(p);
    } else {
      if (list) list = null;
      paragraph.push(line);
    }
  }
  flush();
  return root;
}

// "returns.md#2" -> "Returns". Sources are listed by title only, one line per document.
function docTitle(citation) {
  const name = citation.split("#")[0].split("/").pop().replace(/\.[^.]+$/, "").replace(/[-_]+/g, " ");
  return name.charAt(0).toUpperCase() + name.slice(1);
}

function addMessage(kind) {
  const msg = el("div", "msg " + kind);
  log.append(msg);
  return msg;
}

function renderReply(container, answer) {
  // Numbered per document, in order of first citation, so two passages from one file share a number.
  const numbers = new Map();
  const box = el("div", "answer");
  const cite = (citation) => {
    const title = docTitle(citation);
    if (!numbers.has(title)) numbers.set(title, numbers.size + 1);
    const chip = el("button", "cite", String(numbers.get(title)));
    chip.type = "button";
    chip.title = title;
    chip.addEventListener("click", () => focusSource(box, title));
    return chip;
  };
  box.append(renderMarkdown(answer, cite));

  if (numbers.size) {
    const panel = el("div", "sources");
    panel.append(el("div", "sources-title", "Sources"));
    for (const [title, number] of numbers) {
      const row = el("div", "source");
      row.dataset.title = title;
      row.append(el("span", "num", String(number)), el("span", "", title));
      panel.append(row);
    }
    box.append(panel);
  }
  container.append(box);
}

function focusSource(box, title) {
  const row = [...box.querySelectorAll(".source")].find(r => r.dataset.title === title);
  if (!row) return;
  row.classList.add("flash");
  row.scrollIntoView({ block: "nearest", behavior: "smooth" });
  setTimeout(() => row.classList.remove("flash"), 1200);
}

async function ask(question) {
  document.getElementById("examples")?.remove();
  const button = form.querySelector("button");
  button.disabled = true;
  addMessage("user").append(el("div", "bubble", question));
  const reply = addMessage("agent");
  const waiting = el("div", "answer thinking", "Searching the documents");
  reply.append(waiting);
  reply.scrollIntoView({ block: "end", behavior: "smooth" });
  try {
    // /run, not /run_sse: the server screens only complete responses.
    const response = await fetch("run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        appName: "rag_agent", userId: "web", sessionId,
        newMessage: { role: "user", parts: [{ text: question }] },
      }),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    let answer = "";
    for (const event of await response.json()) {
      for (const part of event.content?.parts || []) {
        if (part.text && !part.thought) answer = part.text;
      }
    }
    waiting.remove();
    renderReply(reply, answer || "(no answer)");
  } catch (error) {
    waiting.remove();
    reply.append(el("div", "answer error", `Request failed: ${error.message}. If your sign-in expired, reload the page.`));
  } finally {
    button.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  ask(question);
});
document.querySelectorAll("#examples button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
input.focus();
</script>
</body>
</html>
