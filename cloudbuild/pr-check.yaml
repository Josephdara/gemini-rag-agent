# Pull request check: tests, security scans, and a read-only Terraform plan. Nothing here applies or deploys.
steps:
  - id: tests
    name: python:3.13.13-slim
    entrypoint: sh
    args: ["-c", "pip install --quiet uv==0.11.17 && uv sync --frozen && uv run pytest -q"]
    env:
      - UV_PROJECT_ENVIRONMENT=/tmp/venv

  # Terraform misconfiguration, vulnerable locked dependencies, and committed secrets. HIGH and CRITICAL fail.
  - id: scan-config
    name: aquasec/trivy:0.75.0
    args: ["config", "--severity", "HIGH,CRITICAL", "--exit-code", "1", "infra"]

  - id: scan-dependencies-and-secrets
    name: aquasec/trivy:0.75.0
    args: ["fs", "--scanners", "vuln,secret", "--severity", "HIGH,CRITICAL", "--exit-code", "1", "--skip-dirs", ".venv", "."]

  - id: config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:587.0.0-slim
    entrypoint: gcloud
    args: ["storage", "cp", "gs://${_STATE_BUCKET}/config/terraform.tfvars.json", "infra/"]

  - id: fmt
    name: hashicorp/terraform:1.16.4
    args: ["-chdir=infra", "fmt", "-check", "-recursive"]

  - id: plan
    name: hashicorp/terraform:1.16.4
    entrypoint: sh
    args:
      - -c
      - |
        terraform -chdir=infra init -input=false -backend-config="bucket=${_STATE_BUCKET}"
        terraform -chdir=infra validate
        terraform -chdir=infra plan -input=false -lock=false

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
  env:
    - TF_IN_AUTOMATION=1
